{% extends "base.html" %}{% block title %}Register | StockWise{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card shadow-sm auth-card"><div class="card-body p-4">
<h3>Create account</h3><p class="text-muted">New accounts are created with staff access.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password (8+ characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<button class="btn btn-primary w-100">Register</button>
</form><p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Back to login</a></p>
</div></div></div>
{% endblock %}
