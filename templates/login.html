{% extends "base.html" %}{% block title %}Login | StockWise{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card shadow-sm auth-card"><div class="card-body p-4">
<h3 class="mb-1">Welcome back</h3><p class="text-muted">Sign in to manage your inventory.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Username or email</label><input class="form-control" name="identity" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Login</button>
</form><p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div></div>
{% endblock %}
